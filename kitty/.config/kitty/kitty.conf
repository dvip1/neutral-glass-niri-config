# GNOME's Mutter compositor has no server-side window decoration support
# on Wayland (a deliberate GNOME design choice, not a bug) — every
# non-GTK Wayland client has to draw its own title bar there. This makes
# kitty's client-drawn bar blend in like a modern GNOME/libadwaita app
# (flat header matching the window content) instead of looking like a
# generic OS decoration.
wayland_titlebar_color background

# Translucent background (works in GNOME and niri; niri adds the blur
# itself via a window rule in ~/.config/niri/config.kdl).
background_opacity 0.85
