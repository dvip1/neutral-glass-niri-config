# ~/.tmux.conf
# Set a longer history limit
set -g history-limit 50000

#-- INDEXING ------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1

#-- MOUSE ---------------------------------------------------------------------
# Master switch: scroll, click-to-focus, drag-to-resize, status-bar clicks.
set -g mouse on

# Copy-mode dialect. Your bindings are vim-flavoured but copy-mode defaulted to
# emacs — this also decides which table the mouse bindings below land in.
set -g mode-keys vi

# Alacritty does not implement OSC 52 *writes*, so "set-clipboard on" never
# reaches your real clipboard (text sits in tmux's buffer only). Every copy
# below pipes to wl-copy instead to hit the Wayland clipboard directly.
set -s set-clipboard off

# Double-click selects a whole path/URL instead of stopping at every . / : -
# Default separators are all punctuation, which shreds /home/dvip/.tmux.conf
# into four selections.
set -g word-separators ' '

# A real draggable scrollbar, shown only while in copy mode. New in tmux 3.6,
# off by default. Styled as a hanging silk thread.
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style 'bg=#241F38,fg=#D9B96C,width=1,pad=1'

# Finer scroll: 5 lines per notch by default, 2 tracks the wheel much closer.
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 2 scroll-down

# Releasing a drag copies the selection to the system clipboard (wl-copy) AND
# exits copy mode, snapping straight back to the prompt.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel wl-copy

# Double-click copies the whole word to the system clipboard and leaves copy mode.
bind -T root DoubleClick1Pane select-pane -t= \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel wl-copy }

# Triple-click copies the whole line to the system clipboard and leaves copy mode.
bind -T root TripleClick1Pane select-pane -t= \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel wl-copy }

#-- COPY MODE (VIM VISUAL SEMANTICS) ------------------------------------------
# tmux's vi table binds `v` to rectangle-toggle and hides begin-selection on
# Space — so pressing `v` out of vim habit flips a flag with nothing selected
# and you just sit there with a bare cursor. Restore vim's meanings:
#   v      start selection (highlight appears immediately)
#   C-v    toggle block/rectangle selection, as in vim
#   V      select whole line
#   y      yank to the Wayland clipboard and leave copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi V send -X select-line

# Keyboard copies were only reaching tmux's own buffer: set-clipboard is off
# (Alacritty ignores OSC 52 writes) and these had no pipe command, so only the
# mouse drag above ever hit the real clipboard. Pipe both through wl-copy.
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel wl-copy
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel wl-copy

# Drag a window along the status bar to reorder it.
bind -n MouseDrag1Status swap-window -t=

# Panic switch — turn the mouse off when you need the terminal's own selection
# (though Shift+drag already bypasses tmux in most terminals).
bind M set -g mouse \; display "Mouse: #{?mouse,ON,OFF}"

# Scrolling over the status bar changes window — uncomment to stop that.
# unbind -n WheelUpStatus
# unbind -n WheelDownStatus

#-- KEYBINDINGS ---------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
#-- Pane Splitting (Vim Style) --
bind l split-window -h
bind j split-window -v
#-- Pane Navigation (Vim Style) --
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

#-- STYLING & AESTHETICS - HOLLOW KNIGHT: SILKSONG -----------------------------
# Pharloom at night: Hornet's crimson cloak and needle-gold silk strung across
# the deep violet dark of the Citadel. Every glyph below is plain Unicode —
# no Nerd Font required, and the ░▒▓ fades stand in for powerline wings.
#
#   Citadel Void:  #12101C  — deepest Pharloom night (dark-on-accent text)
#   Silk Shadow:   #1C1830  — status bar bg (the hush between bells)
#   Loom Weave:    #241F38  — inactive window bg / dim pane border
#   Thread Gold:   #D9B96C  — spun silk: active window, active pane, prefix
#   Dim Thread:    #8F7A47  — a thread out of the light
#   Hornet Crimson:#B33A3F  — the cloak: session banner, messages
#   Ember Rust:    #D9614C  — a struck needle-spark: activity alert
#   Moth Grey:     #7A7290  — inactive window text (dust and wingscale)
#   Pale Silk:     #EDE6D6  — bone-white highlight text
#   Bell Blue:     #9FB8D4  — cold Citadel bell-light: copy mode, clock

set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#1C1830 fg=#EDE6D6'

# Left: Hornet's crest + session name, on the crimson cloak, frayed out into
# the dark with a woven ░▒▓ fade.
set -g status-left-length 60
set -g status-left '#[fg=#12101C,bg=#B33A3F,bold] ❖ #S #[fg=#B33A3F,bg=#1C1830,nobold]▓▒░ '

# Right, right-to-left:
#   ⌁ copy-mode badge (bell blue)  — browsing, no selection yet
#   ⌁ VISUAL / V-BLOCK (gold)      — a selection is live, mirroring mode-style
#   ✦ NEEDLE prefix badge (gold)   — only while the prefix key is held
#   ⌇ silk thread, clock, date, and a ☾ hanging at the end of the line
# Commas inside #{?...} must be escaped as #, — hence the odd-looking #,.
set -g status-right-length 90
set -g status-right '#{?pane_in_mode,#{?selection_present,#[fg=#D9B96C#,bg=#1C1830]░▒▓#[fg=#12101C#,bg=#D9B96C#,bold] ⌁ #{?rectangle_toggle,V-BLOCK,VISUAL} #[fg=#D9B96C#,bg=#1C1830#,nobold]▓▒░,#[fg=#9FB8D4#,bg=#1C1830]░▒▓#[fg=#12101C#,bg=#9FB8D4#,bold] ⌁ #{pane_mode} #[fg=#9FB8D4#,bg=#1C1830#,nobold]▓▒░},}#{?client_prefix,#[fg=#D9B96C#,bg=#1C1830]░▒▓#[fg=#12101C#,bg=#D9B96C#,bold] ✦ NEEDLE #[fg=#D9B96C#,bg=#1C1830#,nobold]▓▒░,}#[fg=#8F7A47] ⌇ #[fg=#9FB8D4]%H:%M #[fg=#7A7290]· #[fg=#EDE6D6]%d %b #[fg=#B33A3F]☾ '

# Window list
# Inactive: moth-grey dust on the weave, threaded together by ⌇
# Active: void-dark on spun gold, wrapped in ░▒▓ silk
setw -g window-status-style 'fg=#7A7290 bg=#241F38'
setw -g window-status-current-style 'fg=#12101C bg=#D9B96C bold'
setw -g window-status-format ' #I ⌇ #W#{?window_zoomed_flag, ⊙,} '
setw -g window-status-current-format '#[fg=#D9B96C,bg=#1C1830]░▒▓#[fg=#12101C,bg=#D9B96C,bold] ❖ #I ⌇ #W#{?window_zoomed_flag, ⊙,} #[fg=#D9B96C,bg=#1C1830,nobold]▓▒░'
setw -g window-status-separator ''

# Alerts — a needle-spark of ember rust; a bell-toll in crimson
setw -g window-status-activity-style 'fg=#D9614C bg=#241F38'
setw -g window-status-bell-style 'fg=#12101C bg=#D9614C bold'
setw -g window-status-last-style 'fg=#9FB8D4 bg=#241F38'

# Pane borders — dim weave, lit gold on the pane you're in
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#241F38'
set -g pane-active-border-style 'fg=#D9B96C'
set -g display-panes-colour '#7A7290'
set -g display-panes-active-colour '#D9B96C'

# Messages & the command prompt — pale silk on Hornet's cloak
set -g message-style 'fg=#EDE6D6 bg=#B33A3F bold'
set -g message-command-style 'fg=#12101C bg=#D9B96C bold'

# Copy-mode: gold selection thread, bell-blue search hits, bell-blue indicator
setw -g mode-style 'fg=#12101C bg=#D9B96C bold'
set -g copy-mode-match-style 'fg=#12101C bg=#9FB8D4'
set -g copy-mode-current-match-style 'fg=#12101C bg=#EDE6D6 bold'
set -g copy-mode-mark-style 'fg=#12101C bg=#D9614C'

# Clock mode — spun gold
setw -g clock-mode-colour '#D9B96C'

# Optional: hang each pane's title from its top border like a silk tag.
# Uncomment both lines to enable.
# set -g pane-border-status top
# set -g pane-border-format '#[fg=#7A7290]─╴#{?pane_active,#[fg=#D9B96C#,bold],}#P ⌇ #{pane_current_command}#[default]#[fg=#7A7290]╶─'


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Enable automatic restore on tmux start
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
