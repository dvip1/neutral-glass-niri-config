# GENERATED by `theme apply` from ~/.config/theme/templates/fuzzel.ini - edit that or theme.toml, not this file.
[main]
# on-demand: clicking another window takes focus, and fuzzel then closes itself
# (exit-on-keyboard-focus-loss defaults to yes); exclusive would keep the keyboard until Esc
keyboard-focus=on-demand
font=JetBrains Mono:size=12.5,Cascadia Code NF:size=12.5
prompt="❯  "
width=38
lines=8
line-height=22
horizontal-pad=24
vertical-pad=18
inner-pad=12

[colors]
background=282828fa
text=d5c4a1ff
prompt=fabd2fff
input=ebdbb2ff
match=fabd2fff
selection-match=fabd2fff
selection=fabd2f29
selection-text=ebdbb2ff
border=504945ff

[border]
width=1
radius=8
selection-radius=4
