# GENERATED by `theme apply` from ~/.config/theme/templates/fuzzel.ini - edit that or theme.toml, not this file.
[main]
# on-demand: clicking another window takes focus, and fuzzel then closes itself
# (exit-on-keyboard-focus-loss defaults to yes); exclusive would keep the keyboard until Esc
keyboard-focus=on-demand
font=Adwaita Sans:size=13,Cascadia Code NF:size=13
prompt="❯  "
width=38
lines=8
line-height=22
horizontal-pad=24
vertical-pad=18
inner-pad=12

[colors]
background=1c1c1c94
text=b8b8b8ff
prompt=ffffffff
input=ffffffff
match=ffffffff
selection-match=ffffffff
selection=ffffff1f
selection-text=ffffffff
border=ffffff22

[border]
width=1
radius=14
selection-radius=7
