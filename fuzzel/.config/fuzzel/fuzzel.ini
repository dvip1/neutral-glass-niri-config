# GENERATED by `theme apply` from ~/.config/theme/templates/fuzzel.ini - edit that or theme.toml, not this file.
[main]
# on-demand: clicking another window takes focus, and fuzzel then closes itself
# (exit-on-keyboard-focus-loss defaults to yes); exclusive would keep the keyboard until Esc
keyboard-focus=on-demand
font=Inter:size=13,Cascadia Code NF:size=13
prompt="❯  "
width=38
lines=8
line-height=22
horizontal-pad=24
vertical-pad=18
inner-pad=12

[colors]
background=191724d1
text=c0bdd8ff
prompt=ebbcbaff
input=e0def4ff
match=ebbcbaff
selection-match=ebbcbaff
selection=ebbcba29
selection-text=e0def4ff
border=e0def421

[border]
width=1
radius=18
selection-radius=9
