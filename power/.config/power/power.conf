# Power settings  (read by ~/.local/bin/idle, which niri starts at login)
#
# Just save the file: changes apply within a few seconds and you get a notification.
# Times are in minutes after you stop using the computer (decimals ok, 0 = never).
# Before any suspend the screen is always locked first.
# *_profile: power-saver | balanced | performance, switched to when the power source
# changes (empty = leave it as is; the bar's speedometer button changes it by hand).

# ---- on battery ----
battery_lock       = 5
battery_screen_off = 6
battery_suspend    = 15
battery_profile    =           # when you unplug

# ---- plugged in ----
ac_lock            = 10
ac_screen_off      = 15
ac_suspend         = 0
ac_profile         =           # when you plug in

# ---- battery warnings (percent, 0 = off) ----
low_battery        = 20        # normal notification
critical_battery   = 10        # urgent notification (stays until dismissed)
