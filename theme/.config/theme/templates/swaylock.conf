# GENERATED by `theme apply` from ~/.config/theme/templates/swaylock.conf - edit that or theme.toml, not this file.
# Background: the wallpaper blurred and dimmed/brightened per mode (setwall writes it); colour if missing.
image=~/.cache/lockscreen/{{mode}}.png
scaling=fill
color={{lock_bg|hex}}
font={{font}}
font-size=22
indicator-radius=80
indicator-thickness=4
indicator-idle-visible
show-failed-attempts
ignore-empty-password
inside-color={{lock_inside|hex}}
inside-ver-color={{lock_inside|hex}}
inside-wrong-color={{lock_inside|hex}}
inside-clear-color={{lock_inside|hex}}
inside-caps-lock-color={{lock_inside|hex}}
ring-color={{lock_ring|hex}}
ring-ver-color={{lock_ring_ver|hex}}
ring-wrong-color={{lock_bad|hex}}
ring-clear-color={{lock_clear|hex}}
ring-caps-lock-color={{lock_ring|hex}}
line-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
line-clear-color=00000000
line-caps-lock-color=00000000
separator-color=00000000
text-color={{lock_text|hex}}
text-ver-color={{lock_text|hex}}
text-wrong-color={{lock_bad|hex}}
text-clear-color={{lock_text|hex}}
text-caps-lock-color={{lock_text|hex}}
key-hl-color={{lock_key_hl|hex}}
bs-hl-color={{lock_bs_hl|hex}}
caps-lock-key-hl-color={{lock_key_hl|hex}}
caps-lock-bs-hl-color={{lock_bs_hl|hex}}
layout-bg-color=00000000
layout-border-color=00000000
layout-text-color={{lock_text|hex}}
