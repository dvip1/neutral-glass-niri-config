# Rosé Pine: soft, muted purples with a rose accent, still glass (blur), rounder corners.
# Palette: https://rosepinetheme.com/palette  (main / dawn)
description = "Soft muted purple glass, rose accent"

[font]
family = "Inter"

[shape]
radius = 16
radius_large = 18
radius_pill = 12
radius_small = 9
gaps = 12

[effects]
blur = true
kitty_opacity = 0.85

[opacity]          # more solid than the shared defaults: the palette is soft, so the glass must not wash it out
alpha_bar = 0.8
alpha_panel = 0.82
alpha_card = 0.88
alpha_osd = 0.75

[gtk]
accent = "pink"

[kitty]
dark  = "Rosé Pine"
light = "Rosé Pine Dawn"

[dark]
bg       = "#191724"   # base
surface  = "#1f1d2e"   # surface
fg       = "#e0def4"   # text
fg_muted = "#9692b0"   # subtle, a touch lighter (Rose Pine's "muted" #6e6a86 is for comments: unreadable on glass)
fg_title = "#c0bdd8"   # between text and subtle
accent   = "#ebbcba"   # rose
c_crit   = "#eb6f92"   # love
c_warn   = "#f6c177"   # gold
c_ok     = "#9ccfd8"   # foam
ws_dot   = "#908caa66"

[light]
bg       = "#faf4ed"
surface  = "#fffaf3"
fg       = "#4a4566"   # text, a little deeper than Dawn's #575279 so it holds up on glass
fg_muted = "#635e7e"   # between Dawn's subtle and text (its "muted" #9893a5 is for comments)
fg_title = "#5b5678"
accent   = "#b35d59"   # Dawn rose #d7827e, deepened: text on it (tiles, switches, today) needs contrast
c_crit   = "#b4637a"
c_warn   = "#ea9d34"
c_ok     = "#56949f"
alpha_bar = 0.86   # a light panel over a dark wallpaper needs to be nearly solid
alpha_panel = 0.88
alpha_card = 0.9
