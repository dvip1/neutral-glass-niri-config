fz_text      = "#3a3a3aff"
fz_prompt    = "#000000ff"
fz_input     = "#000000ff"
fz_match     = "#000000ff"
fz_sel_match = "#000000ff"
fz_sel       = "#00000018"
fz_sel_text  = "#000000ff"
fz_border    = "#00000022"

# Volume / brightness popup (swayosd)
osd_bg     = "rgba(245, 245, 245, 0.55)"
osd_border = "rgba(0, 0, 0, 0.14)"
osd_fg     = "#1a1a1a"
osd_trough = "rgba(0, 0, 0, 0.18)"
osd_bar    = "#1a1a1a"

# Window focus ring (niri)
