sw_btn_soft    = "rgba(0, 0, 0, 0.06)"
sw_cc          = "rgba(245, 245, 245, 0.5)"
sw_switch_on   = "rgba(0, 0, 0, 0.5)"
sw_slider      = "#ffffff"

