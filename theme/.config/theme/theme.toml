# ~/.config/theme/theme.toml  -  the one place to change how the desktop looks.
#
#   theme apply     regenerate every app's config from this file and reload them
#   theme toggle    flip dark <-> light (also: theme dark / theme light)
#
# Colours can be "#rrggbb", "#rrggbbaa" or "rgba(r, g, b, a)". Alpha is the glass
# transparency (0 = invisible, 1 = solid). Each app's layout lives in templates/.

[font]
family = "Adwaita Sans"     # UI text everywhere (kitty/nvim keep their own mono font)
icons = "Cascadia Code NF"  # fallback that supplies the Nerd Font icon glyphs
size = 13          # notifications, menus, volume popup
bar_size = 13.5    # waybar

[shape]
radius = 12        # bar, notification cards, windows (niri blur follows this too)
radius_large = 14  # launcher / menus and the volume popup
radius_pill = 10   # pills on the bar, tooltips
radius_small = 7   # anything inside a pill or card: hovers, buttons, selections, thumbnails
ring_width = 2     # focus ring around the active window, in px

[motion]           # bar hover/press timing (waybar CSS transitions and the Quickshell bar)
hover_in = 110     # ms to light up under the pointer: quick
hover_out = 320    # ms to settle back after it leaves: slower, feels softer
pill_ms = 420      # ms for the active-workspace pill to stretch / shrink
spring = "cubic-bezier(0.34, 1.35, 0.64, 1)"   # slight overshoot, like a spring

[kitty]            # themes from kitty's own collection (run `kitten themes` to browse names)
dark  = "Min Dark"          # neutral #1f1f1f, text 15:1, every colour >= 6:1
light = "Modus Operandi"    # white/black, text 21:1, every colour >= 7:1
no_preference = "dark"      # which one to use if the OS reports no preference

[targets]          # template -> where the generated file goes
waybar  = { src = "templates/waybar.css",  dest = "~/.config/waybar/style.css" }
swaync  = { src = "templates/swaync.css",  dest = "~/.config/swaync/style.css" }
swayosd = { src = "templates/swayosd.css", dest = "~/.config/swayosd/style.css" }
fuzzel  = { src = "templates/fuzzel.ini",  dest = "~/.config/fuzzel/fuzzel.ini" }
swaylock = { src = "templates/swaylock.conf", dest = "~/.config/swaylock/config" }
niri    = { src = "templates/niri.kdl",    dest = "~/.config/theme/out/niri.kdl" }
nowplaying = { src = "templates/nowplaying.css", dest = "~/.config/theme/out/nowplaying.css" }
powerpanel = { src = "templates/powerpanel.css", dest = "~/.config/theme/out/powerpanel.css" }
quickshell = { src = "templates/quickshell.qml", dest = "~/.config/quickshell/Theme.qml" }   # Quickshell reloads by itself
icons   = { src = "templates/icons",       dest = "~/.config/theme/out/icons" }   # launcher icons (a folder: every file is rendered)

[dark]
