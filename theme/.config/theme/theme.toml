# ~/.config/theme/theme.toml  -  what every theme shares.
#
# The themes themselves are in themes/*.toml (one file each). A theme file is laid over this one:
# anything it sets wins, anything it leaves out comes from here.
#
#   theme list / theme set NAME / theme next     pick a theme
#   theme toggle  (theme dark / theme light)      flip the mode of the current theme
#   theme apply                                   regenerate everything after editing
#
# Colours can be "#rrggbb", "#rrggbbaa" or "rgba(r, g, b, a)". Alpha is the glass
# transparency (0 = invisible, 1 = solid). Each app's layout lives in templates/.

[font]
family = "Adwaita Sans"     # UI text everywhere (kitty/nvim keep their own mono font)
icons = "Cascadia Code NF"  # fallback that supplies the Nerd Font icon glyphs
size = 13          # notifications, menus, volume popup
bar_size = 13.5    # the bar

[shape]
radius = 12        # bar, notification cards, windows (niri blur and the window-open shader follow this too)
radius_large = 14  # launcher / menus and the volume popup
radius_pill = 10   # pills on the bar, tooltips
radius_small = 7   # anything inside a pill or card: hovers, buttons, selections, thumbnails
ring_width = 2     # focus ring around the active window, in px
gaps = 10          # between windows (niri)

[effects]
blur = true            # niri blur behind the bar, menus, popups and kitty (false = flat, solid panels)
kitty_opacity = 0.80   # kitty's background opacity

[motion]           # bar hover/press timing (waybar CSS transitions and the Quickshell bar)
hover_in = 70      # ms to light up under the pointer: quick
hover_out = 180    # ms to settle back after it leaves: a little softer
pill_ms = 240      # ms for pills, highlights and panels to move / stretch
spring = "cubic-bezier(0.3, 1.12, 0.6, 1)"   # a hint of overshoot, like a stiff spring

[kitty]            # themes from kitty's own collection (run `kitten themes` to browse names)
dark  = "Min Dark"
light = "Modus Operandi"
no_preference = "dark"      # which one to use if the OS reports no preference

# [gtk] accent = "slate"    # optional, per theme: libadwaita (GTK4) accent (blue teal green yellow orange red pink purple slate)
#                           GTK3 apps get the theme's full colours instead (template gtk3.css, niri only)

[opacity]          # named alphas the formulas below use; a theme (or its [dark]/[light]) can override them
alpha_bar = 0.6    # the bar
alpha_panel = 0.7  # launcher, menus
alpha_card = 0.8   # notification cards
alpha_osd = 0.55   # volume / brightness popup
alpha_tip = 0.9    # tooltips
alpha_ring = 0.7   # focus ring

# How every colour an app uses is made from a theme's few base colours. A theme's [dark] / [light]
# needs only: bg, surface, fg, fg_muted, accent, c_crit, c_warn, c_ok. It may also set any name
# below directly (glass sets them all), which then wins over the formula.
#   "fg @ 0.13"               fg with alpha 0.13 (a number or a name from [opacity])
#   "mix(fg, fg_muted, 0.4)"  40 % of the way from fg to fg_muted
[derive]
fg_strong    = "fg"
fg_title     = "mix(fg, fg_muted, 0.4)"
# Bar
bar_bg       = "bg @ alpha_bar"
bar_border   = "fg @ 0.12"
pill_bg      = "fg @ 0.05"
pill_hover   = "fg @ 0.10"
pill_press   = "fg @ 0.16"
ws_hover     = "fg @ 0.08"
ws_active_bg = "accent @ 0.18"
ws_dot       = "fg @ 0.30"
ws_dot_hover = "fg @ 0.60"
ws_pill      = "accent"           # also: tiles/switches that are on, today in the calendar
ws_urgent_bg = "c_crit @ 0.15"
tip_bg       = "surface @ alpha_tip"
tip_border   = "fg @ 0.14"
# Notifications (swaync)
sw_text        = "fg_strong"
sw_dim         = "fg @ 0.6"
sw_body        = "fg @ 0.85"
sw_card        = "surface @ alpha_card"
sw_border      = "fg @ 0.14"
sw_border_crit = "c_crit @ 0.7"
sw_btn         = "fg @ 0.12"
sw_btn_hover   = "fg @ 0.25"
sw_btn_soft    = "fg @ 0.08"
sw_cc          = "bg @ 0.45"
sw_switch_on   = "accent @ 0.6"
sw_slider      = "fg_strong"
# Launcher + menus (fuzzel)
fz_bg        = "bg @ alpha_panel"
fz_text      = "fg_title"
fz_prompt    = "accent"
fz_input     = "fg_strong"
fz_match     = "accent"
fz_sel_match = "accent"
fz_sel       = "accent @ 0.16"
fz_sel_text  = "fg_strong"
fz_border    = "fg @ 0.13"
# Volume / brightness popup
osd_bg     = "surface @ alpha_osd"
osd_border = "fg @ 0.14"
osd_fg     = "fg_strong"
osd_trough = "fg @ 0.2"
osd_bar    = "accent"
# Window focus ring (niri)
ring_active   = "accent @ alpha_ring"
ring_inactive = "fg @ 0.1"
# Lock screen (swaylock)
lock_bg       = "bg @ 1"
lock_inside   = "bg @ 0.25"
lock_ring     = "fg @ 0.18"
lock_text     = "fg_strong"
lock_key_hl   = "accent @ 0.9"
lock_bs_hl    = "fg @ 0.4"
lock_ring_ver = "accent @ 0.6"
lock_bad      = "c_crit"
lock_clear    = "fg @ 0.3"
# GTK3 apps under niri (adw-gtk3 recoloured; solid, GTK can't blur)
gtk_window_bg   = "bg @ 1"
gtk_window_fg   = "fg"
gtk_view_bg     = "mix(bg, surface, 0.6) @ 1"
gtk_header_bg   = "mix(bg, fg, 0.06) @ 1"
gtk_sidebar_bg  = "mix(bg, fg, 0.04) @ 1"
gtk_popover_bg  = "mix(bg, fg, 0.09) @ 1"
gtk_card_bg     = "fg @ 0.06"
gtk_accent_bg   = "accent @ 1"
gtk_accent_fg   = "on(gtk_accent_bg)"
gtk_crit_bg     = "c_crit @ 1"
gtk_crit_fg     = "on(gtk_crit_bg)"
gtk_ok_bg       = "c_ok @ 1"
gtk_ok_fg       = "on(gtk_ok_bg)"
gtk_warn_bg     = "c_warn @ 1"
gtk_warn_fg     = "on(gtk_warn_bg)"
# Settings app (niri-settings, Qt)
set_bg          = "bg @ alpha_panel"
set_side        = "fg @ 0.03"
set_card        = "fg @ 0.045"
set_line        = "fg @ 0.08"
set_line_strong = "fg @ 0.3"
set_field       = "fg @ 0.08"
set_field_hover = "fg @ 0.13"
set_sel         = "accent @ 0.2"
set_focus       = "accent @ 0.6"
set_track       = "fg @ 0.2"
set_knob        = "fg_strong"
set_popup       = "mix(bg, surface, 0.5) @ 0.98"
set_accent_fg   = "on(accent)"
# Folder + home/desktop icons (Files etc., niri only): Adwaita's blues, remade from one colour
folder          = "accent @ 1"
folder_dark     = "mix(folder, #000000, 0.14)"
folder_light    = "mix(folder, #ffffff, 0.45)"
folder_lighter  = "mix(folder, #ffffff, 0.55)"
folder_paper    = "mix(folder, #ffffff, 0.65)"
folder_deep     = "mix(folder, #000000, 0.3)"
folder_deeper   = "mix(folder, #000000, 0.4)"
folder_deepest  = "mix(folder, #000000, 0.55)"

[targets]          # template -> where the generated file goes
waybar  = { src = "templates/waybar.css",  dest = "~/.config/waybar/style.css" }
swaync  = { src = "templates/swaync.css",  dest = "~/.config/swaync/style.css" }
swayosd = { src = "templates/swayosd.css", dest = "~/.config/swayosd/style.css" }
fuzzel  = { src = "templates/fuzzel.ini",  dest = "~/.config/fuzzel/fuzzel.ini" }
swaylock = { src = "templates/swaylock.conf", dest = "~/.config/swaylock/config" }
niri    = { src = "templates/niri.kdl",    dest = "~/.config/theme/out/niri.kdl" }
animations = { src = "templates/animations.kdl", dest = "~/.config/niri/animations.kdl" }   # window open/close shaders (corner radius)
kitty   = { src = "templates/kitty.conf",  dest = "~/.config/kitty/theme.conf" }   # opacity; colours come from [kitty]
nowplaying = { src = "templates/nowplaying.css", dest = "~/.config/theme/out/nowplaying.css" }
powerpanel = { src = "templates/powerpanel.css", dest = "~/.config/theme/out/powerpanel.css" }
quickshell = { src = "templates/quickshell.qml", dest = "~/.config/quickshell/Theme.qml" }   # Quickshell reloads by itself
gtk3    = { src = "templates/gtk3.css",    dest = "~/.config/theme/out/gtk/Niri/gtk-3.0/gtk.css" }   # GTK3 theme "Niri", used under niri only
folders = { src = "templates/folders",    dest = "~/.config/theme/out/icon-theme/Niri/scalable/places" }   # icon theme "Niri", niri only
folders_index = { src = "templates/icon-theme.index", dest = "~/.config/theme/out/icon-theme/Niri/index.theme" }
settings = { src = "templates/settings.qss", dest = "~/.config/theme/out/settings.qss" }   # niri-settings reloads it by itself
icons   = { src = "templates/icons",       dest = "~/.config/theme/out/icons" }   # launcher icons (a folder: every file is rendered)
